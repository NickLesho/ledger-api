name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unit tests (Surefire) + Testcontainers integration tests (Failsafe).
      # GitHub's Ubuntu runners include Docker, so Testcontainers works unchanged.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Docker build (no push)
        run: docker build -t ledger-api:ci .

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      # Terraform via its official image: no AWS credentials, no backend access.
      - name: Format check
        run: docker run --rm -v "$PWD:/w" -w /w hashicorp/terraform:1.16 fmt -check -recursive infra

      - name: Validate core layer
        run: |
          docker run --rm -v "$PWD:/w" -w /w/infra hashicorp/terraform:1.16 init -backend=false -input=false
          docker run --rm -v "$PWD:/w" -w /w/infra hashicorp/terraform:1.16 validate

      - name: Validate app layer
        run: |
          docker run --rm -v "$PWD:/w" -w /w/infra/app hashicorp/terraform:1.16 init -backend=false -input=false
          docker run --rm -v "$PWD:/w" -w /w/infra/app hashicorp/terraform:1.16 validate